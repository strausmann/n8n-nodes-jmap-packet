name: Release

# Never on push — a release is a deliberate act, and CI is the safety net
# that must pass first.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write # npm provenance + OIDC trusted publishing

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # semantic-release needs the full tag history
      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          # Deliberately no registry-url: it makes setup-node write an .npmrc
          # referencing NODE_AUTH_TOKEN, which is unset here, so npm whoami
          # fails and semantic-release reports EINVALIDNPMTOKEN even though
          # NPM_TOKEN is valid. semantic-release writes its own auth config.

      - name: Upgrade npm for OIDC trusted publishing
        # Node 22 ships npm 10.x; OIDC trusted publishing needs npm >= 11.5.1.
        # Harmless while publishing with NPM_TOKEN, required once the token is gone.
        run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npx semantic-release

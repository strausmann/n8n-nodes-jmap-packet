name: renovate

on:
  # The nightly schedule stays commented out until INFISICAL_CLIENT_ID and
  # INFISICAL_CLIENT_SECRET exist as repository secrets. Enabling it before
  # then would fail every night for a reason that is not a defect, and a job
  # that cries wolf gets ignored when it finally means something.
  # Once the secrets are set, uncomment these two lines: 02:00 puts Renovate
  # an hour ahead of release.yml, so fresh dependencies reach the same night's
  # release.
  # schedule:
  #   - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Fetch RENOVATE_TOKEN from Infisical
        uses: Infisical/secrets-action@v1.0.17
        with:
          method: universal
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: fileee-server-ci
          env-slug: prod
          secret-path: /
          domain: https://secretsmanager.strausmann.cloud

      - uses: renovatebot/github-action@v46.3.0
        with:
          token: ${{ env.RENOVATE_TOKEN }}
          configurationFile: renovate.json
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
